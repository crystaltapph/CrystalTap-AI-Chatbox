plugins { id 'com.android.application' }
android {
    namespace 'com.crystaltap.agent'
    compileSdk 35
    defaultConfig { applicationId 'com.crystaltap.agent'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { candidate { storeFile file(System.getenv('CTAI_ANDROID_STORE_FILE') ?: 'missing-signing-key'); storePassword System.getenv('CTAI_ANDROID_STORE_PASSWORD'); keyAlias 'crystaltap'; keyPassword System.getenv('CTAI_ANDROID_STORE_PASSWORD') } }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.candidate } }
}
dependencies { implementation 'com.google.firebase:firebase-messaging:24.1.1'; testImplementation 'junit:junit:4.13.2'; androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test.ext:junit:1.2.1' }
